[workspace]
resolver = "2"
members = [
    "programs/trustbond-airbag",
    "programs/airbag-logic"
]

[workspace.package]
version = "0.1.0"
authors = ["Liliana <liliana@fedora>"]
edition = "2021"

[workspace.dependencies]
anchor-lang = "1.0.2"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
