services:
  - type: web
    name: trustbound-airbag-backend
    env: python
    plan: free
    buildCommand: pip install -r apps/backend/requirements.txt
    startCommand: python -m uvicorn apps.backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
      - key: API_KEY_X402
      - key: CORS_ALLOWED_ORIGINS
      - key: RUGCHECK_URL
      - key: LOG_LEVEL
      - key: PYTHONPATH
        value: /opt/render/project/src
